name: Windows release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-sign-release:
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'

    steps:
      - name: Check out verified source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: native/Directory.Packages.props

      - name: Resolve release version
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            '0.1.0'
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Release tag must use vMAJOR.MINOR.PATCH. Received: $env:GITHUB_REF_NAME"
          }
          "JARVIS_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "JARVIS_FILE_VERSION=$version.0" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Restore
        run: dotnet restore native/Jarvis.slnx

      - name: Test
        run: >-
          dotnet test native/Jarvis.slnx
          --configuration Release
          --no-restore
          -p:Version=${{ env.JARVIS_VERSION }}
          -p:FileVersion=${{ env.JARVIS_FILE_VERSION }}
          -p:InformationalVersion=${{ env.JARVIS_VERSION }}

      - name: Publish unsigned application
        run: >-
          dotnet publish native/src/Jarvis.App/Jarvis.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          --output native/artifacts/win-x64
          -p:Version=${{ env.JARVIS_VERSION }}
          -p:FileVersion=${{ env.JARVIS_FILE_VERSION }}
          -p:InformationalVersion=${{ env.JARVIS_VERSION }}

      - name: Upload unsigned build provenance artifact
        id: unsigned-artifact
        uses: actions/upload-artifact@v7
        with:
          name: Jarvis-win-x64-unsigned
          path: native/artifacts/win-x64/**
          if-no-files-found: error

      - name: Submit tagged build to SignPath
        id: signpath
        if: >-
          startsWith(github.ref, 'refs/tags/v') &&
          vars.SIGNPATH_ORGANIZATION_ID != '' &&
          vars.SIGNPATH_PROJECT_SLUG != '' &&
          vars.SIGNPATH_SIGNING_POLICY_SLUG != '' &&
          vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG != ''
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned-artifact.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: native/artifacts/signed
          parameters: |
            version: "${{ env.JARVIS_VERSION }}"
            fileVersion: "${{ env.JARVIS_FILE_VERSION }}"

      - name: Upload signed build
        if: steps.signpath.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: Jarvis-win-x64-signed
          path: native/artifacts/signed/**
          if-no-files-found: error

      - name: Create signed GitHub release
        if: startsWith(github.ref, 'refs/tags/v') && steps.signpath.outcome == 'success'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = "Jarvis-$env:JARVIS_VERSION-win-x64-signed.zip"
          Compress-Archive -Path 'native/artifacts/signed/*' -DestinationPath $archive
          gh release create $env:GITHUB_REF_NAME $archive --verify-tag --generate-notes
