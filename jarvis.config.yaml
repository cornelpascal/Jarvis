app:
  name: JARVIS

projects:
  roots:
    - "%USERPROFILE%\\Documents"

voice:
  enabled: true
  activation: hotkey
  hotkey: "Alt+Space"

wake_word:
  enabled: true
  engine: openwakeword
  phrase: "hey jarvis"
  threshold: 0.5
  cooldown_ms: 3000

codex:
  max_concurrent_agents: 3
  default_mode: develop

network:
  bind_host: "127.0.0.1"
  port: 43117
